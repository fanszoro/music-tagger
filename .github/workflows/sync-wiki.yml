name: Sync Docs to GitHub Wiki

on:
  push:
    branches:
      - v0.4.0
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Mirror docs to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clone wiki repo
        id: clone
        run: |
          if git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "⚠️  Wiki not initialized. Please create the first page at:"
            echo "    https://github.com/${{ github.repository }}/wiki"
            echo "    Then re-run this workflow."
          fi

      - name: Prepare wiki pages
        if: steps.clone.outputs.ok == 'true'
        run: |
          # Copy files
          cp docs/guide/getting-started.md         wiki/Getting-Started.md
          cp docs/features/themes.md               wiki/Feature-Themes.md
          cp docs/features/scraper.md              wiki/Feature-Dispute-Management.md
          cp docs/features/logs-cache.md           wiki/Feature-Logs-and-Cache.md
          cp docs/features/player.md               wiki/Feature-Player-and-Editor.md
          cp docs/features/file-management.md      wiki/Feature-File-Health.md
          cp docs/zh/guide/getting-started.md      wiki/快速部署.md
          cp docs/zh/features/themes.md            wiki/功能-主题.md
          cp docs/zh/features/scraper.md           wiki/功能-争议管理.md
          cp docs/zh/features/logs-cache.md        wiki/功能-日志与缓存.md
          cp docs/zh/features/player.md            wiki/功能-播放器与编辑器.md
          cp docs/zh/features/file-management.md   wiki/功能-文件健康检测.md

          # Fix VitePress syntax and internal links for all wiki pages
          fix_for_wiki() {
            local f="$1"
            # VitePress containers → plain GitHub markdown
            sed -i 's/^::: warning$/> ⚠️ **Warning**/g' "$f"
            sed -i 's/^::: tip$/> 💡 **Tip**/g'         "$f"
            sed -i 's/^::: note$/> ℹ️ **Note**/g'        "$f"
            sed -i 's/^:::$//g'                           "$f"

            # EN VitePress paths → Wiki page names
            sed -i 's|](/guide/getting-started)|](Getting-Started)|g'         "$f"
            sed -i 's|](/features/themes)|](Feature-Themes)|g'                "$f"
            sed -i 's|](/features/scraper)|](Feature-Dispute-Management)|g'   "$f"
            sed -i 's|](/features/logs-cache)|](Feature-Logs-and-Cache)|g'    "$f"
            sed -i 's|](/features/player)|](Feature-Player-and-Editor)|g'     "$f"
            sed -i 's|](/features/file-management)|](Feature-File-Health)|g'  "$f"

            # ZH VitePress paths → Wiki page names
            sed -i 's|](/zh/guide/getting-started)|](快速部署)|g'             "$f"
            sed -i 's|](/zh/features/themes)|](功能-主题)|g'                  "$f"
            sed -i 's|](/zh/features/scraper)|](功能-争议管理)|g'             "$f"
            sed -i 's|](/zh/features/logs-cache)|](功能-日志与缓存)|g'        "$f"
            sed -i 's|](/zh/features/player)|](功能-播放器与编辑器)|g'        "$f"
            sed -i 's|](/zh/features/file-management)|](功能-文件健康检测)|g' "$f"
          }

          for f in wiki/*.md; do fix_for_wiki "$f"; done

          # Generate Home page using echo to avoid YAML heredoc indentation conflicts
          {
            echo "# Music Tagger Wiki"
            echo ""
            echo "> Full documentation site: https://fanszoro.github.io/music-tagger/"
            echo ""
            echo "## English"
            echo "- [Getting Started](Getting-Started)"
            echo "- [Themes](Feature-Themes)"
            echo "- [Dispute Management](Feature-Dispute-Management)"
            echo "- [Logs & Cache](Feature-Logs-and-Cache)"
            echo "- [Player & Editor](Feature-Player-and-Editor)"
            echo "- [File Health](Feature-File-Health)"
            echo ""
            echo "## 中文"
            echo "- [快速部署](快速部署)"
            echo "- [主题](功能-主题)"
            echo "- [争议管理](功能-争议管理)"
            echo "- [日志与缓存](功能-日志与缓存)"
            echo "- [播放器与编辑器](功能-播放器与编辑器)"
            echo "- [文件健康检测](功能-文件健康检测)"
          } > wiki/Home.md

      - name: Push to wiki
        if: steps.clone.outputs.ok == 'true'
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to sync." || \
            (git commit -m "docs: sync from ${{ github.sha }}" && git push)
